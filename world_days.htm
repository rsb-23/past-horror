<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="css/common.css" />
    <link rel="icon" href="favicon.png" />
    <style>
      .event {
        width: auto;
        align-items: normal;
        display: block;
      }
      .event-date {
        font-weight: bold;
      }
      ul {
        list-style: none;
        padding-inline-start: 10px;
      }
      li::before {
        content: attr(data-icon);
        margin-right: 10px;
      }
    </style>
    <title>Nostalgia | Famous Days &amp; Birthdays</title>
  </head>

  <body>
    <div class="all">
      <div class="home-icon" onclick="location.href='.'">🏠</div>
      <header>Famous Days <span class="sm-head">and</span> Birthdays</header>
      <div id="events" class="card-container"></div>
    </div>

    <template>
      <div class="card event">
        <div class="event-date"></div>
        <ul></ul>
      </div>
    </template>

    <script src="js/world_days.js"></script>
    <script>
      var today = new Date();
      today.setHours(0, 0, 0, 0); // Ignore time part of today's date.

      var eventsDiv = document.getElementById('events');
      const eventTemplate = document.querySelector('template');

      function addEvent(events, icon, parentDiv) {
        if (events) {
          var eventList = parentDiv.querySelector('ul');
          for (i in events) {
            var listItem = document.createElement('li');
            listItem.dataset.icon = icon;
            listItem.textContent = events[i];
            eventList.appendChild(listItem);
          }
        }
      }

      var count = 0;
      while (count < 4) {
        currDay = dateKey(today);
        eventDate = today.toDateString();
        today.setDate(today.getDate() + 1);

        if (!(currDay in specialDays || currDay in celebBdays)) {
          continue;
        }

        var eventDiv = eventTemplate.content.cloneNode(true);
        var eventDateDiv = eventDiv.querySelector('.event-date');
        eventDateDiv.textContent = eventDate;

        addEvent(specialDays[currDay], '🌐', eventDiv);
        addEvent(celebBdays[currDay], '🎂', eventDiv);

        eventsDiv.appendChild(eventDiv);
        count++;
      }
    </script>
  </body>
</html>
